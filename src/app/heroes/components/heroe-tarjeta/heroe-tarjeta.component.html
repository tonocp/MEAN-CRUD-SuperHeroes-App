<mat-card>
  <mat-card-header>
    <mat-card-title>{{ heroe.superhero }}</mat-card-title>
    <mat-card-subtitle>{{ heroe.alter_ego }}</mat-card-subtitle>
  </mat-card-header>
  <img mat-card-image [src]="heroe | imagen" [alt]="heroe.superhero" />
  <mat-card-content>
    <h3>{{ heroe.publisher }}</h3>
    <p>
      <b>Primera aparición </b> {{ heroe.first_appearance }}
      <br />
      <b>Personajes: </b> {{ heroe.characters }}
    </p>
  </mat-card-content>
  <mat-card-actions>
    <button mat-button color="warn" [routerLink]="['/heroes', heroe._id]">
      Leer más...
    </button>
    <button
      *ngIf="!heroe.seeded"
      mat-button
      color="info"
      [routerLink]="['/heroes/editar', heroe._id]"
    >
      Editar
    </button>
  </mat-card-actions>
</mat-card>
