<app-backend-loader
  *ngIf="!heroe"
  [cargando]="!error"
  [error]="error"
  mensajeCarga="Cargando héroe..."
></app-backend-loader>

<div *ngIf="heroe">
  <app-heroe-ficha [heroe]="heroe">
    <ng-container ficha-footer>
      <br />
      <button mat-button color="warn" (click)="atras()">Atrás</button>
    </ng-container>
  </app-heroe-ficha>
</div>
